name: Build representative district data

on:
  push:
    tags: ['districts-2020-v*']

permissions:
  contents: read

jobs:
  states:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: src
      - name: List states to build
        id: matrix
        run: |
          node -e 'console.log("value=" + JSON.stringify(require("./src/district-states.json").filter(({ code }) => code !== "CT").map(({ fips }) => fips)))' >> "$GITHUB_OUTPUT"

  build:
    needs: states
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        fips: ${{ fromJSON(needs.states.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            src
            scripts
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install 'pyogrio==0.12.1' 'shapely==2.2.0'
      - name: Download Census blocks and shoreline
        env:
          FIPS: ${{ matrix.fips }}
        run: |
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output blocks.zip "https://www2.census.gov/geo/tiger/TIGER2020/TABBLOCK20/tl_2020_${FIPS}_tabblock20.zip"
          curl --fail --location --retry 5 --retry-all-errors --silent --show-error \
            --output shoreline.zip https://www2.census.gov/geo/tiger/GENZ2020/shp/cb_2020_us_state_500k.zip
      - name: Build and package all district counts and algorithms
        env:
          FIPS: ${{ matrix.fips }}
        run: |
          python scripts/build-state-district-data.py "$FIPS" blocks.zip shoreline.zip "built/$FIPS"
          test "$(find "built/$FIPS" -type f -name '*.json.gz' | wc -l)" -eq 22
          tar -C built -cf "districts-$FIPS.tar" "$FIPS"
      - uses: actions/upload-artifact@v7
        with:
          name: districts-${{ matrix.fips }}
          path: districts-${{ matrix.fips }}.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: districts-*
          path: packages
          merge-multiple: true
      - name: Publish versioned state plans
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(find packages -type f -name '*.tar' | wc -l)" -eq 49
          gh release create "$GITHUB_REF_NAME" packages/*.tar \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false \
            --title "2020 Census representative districts" \
            --notes "Precomputed whole-block plans for the 49 states added to the representative districts map."
