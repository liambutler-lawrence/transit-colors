name: Feature request
description: Propose a focused improvement
title: 'Feature: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need or limitation should this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior and any alternatives considered.
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: Data and attribution
      description:
        List any proposed data sources, terms, retrieval method, and coverage.
