name: Bug report
description: Report reproducible incorrect behavior
title: 'Bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the metro area, product view, selections, and exact steps.
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description:
        Screenshots and public source links are welcome. Do not include secrets.
